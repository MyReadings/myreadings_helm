apiVersion: apps/v1
kind: Deployment
metadata:
  name: review-service
  labels:
    app.kubernetes.io/name: review-service
    {{- include "myreadings.labels" . | nindent 4 }}
spec:
  revisionHistoryLimit: 2
  {{- if not (and .Values.review.autoscaling .Values.review.autoscaling.enabled) }}
  replicas: {{ .Values.review.replicas | default 1 }}
  {{- end }}
  selector:
    matchLabels:
      app.kubernetes.io/name: review-service
  template:
    metadata:
      labels:
        app.kubernetes.io/name: review-service
        {{- include "myreadings.labels" . | nindent 8 }}
    spec:
      containers:
        - name: review-service
          image: {{ .Values.global.imageRegistry }}/{{ .Values.review.image }}:{{ .Values.review.tag }}
          imagePullPolicy: Always
          ports:
            - containerPort: {{ .Values.review.port }}
              protocol: TCP
          env:
            {{- include "myreadings.commonEnv" . | nindent 12 }}
            - name: CATALOG_SERVICE_URL
              value: "http://catalog-service:{{ .Values.catalog.port }}"
            - name: USER_SERVICE_URL
              value: "http://user-service:{{ .Values.user.port }}"
          readinessProbe:
            httpGet:
              path: /q/health/ready
              port: {{ .Values.review.port }}
            periodSeconds: 5
            timeoutSeconds: 3
          livenessProbe:
            httpGet:
              path: /q/health/live
              port: {{ .Values.review.port }}
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 3
          startupProbe:
            httpGet:
              path: /q/health/started
              port: {{ .Values.review.port }}
            failureThreshold: 20
            periodSeconds: 5
          resources:
            {{- toYaml .Values.review.resources | nindent 12 }}
