apiVersion: apps/v1
kind: Deployment
metadata:
  name: user-service
  labels:
    app.kubernetes.io/name: user-service
    {{- include "myreadings.labels" . | nindent 4 }}
spec:
  revisionHistoryLimit: 2
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: user-service
  template:
    metadata:
      labels:
        app.kubernetes.io/name: user-service
        {{- include "myreadings.labels" . | nindent 8 }}
    spec:
      containers:
        - name: user-service
          image: {{ .Values.global.imageRegistry }}/{{ .Values.user.image }}:{{ .Values.user.tag }}
          imagePullPolicy: Always
          ports:
            - containerPort: {{ .Values.user.port }}
              protocol: TCP
          env:
            {{- include "myreadings.commonEnv" . | nindent 12 }}
            {{- include "myreadings.rabbitmqEnv" . | nindent 12 }}
          readinessProbe:
            httpGet:
              path: /q/health/ready
              port: {{ .Values.user.port }}
            periodSeconds: 5
            timeoutSeconds: 3
          livenessProbe:
            httpGet:
              path: /q/health/live
              port: {{ .Values.user.port }}
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 3
          startupProbe:
            httpGet:
              path: /q/health/started
              port: {{ .Values.user.port }}
            failureThreshold: 20
            periodSeconds: 5
          resources:
            {{- toYaml .Values.user.resources | nindent 12 }}
