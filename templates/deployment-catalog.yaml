apiVersion: apps/v1
kind: Deployment
metadata:
  name: catalog-service
  labels:
    app.kubernetes.io/name: catalog-service
    {{- include "myreadings.labels" . | nindent 4 }}
spec:
  revisionHistoryLimit: 2
  {{- if not (and .Values.catalog.autoscaling .Values.catalog.autoscaling.enabled) }}
  replicas: {{ .Values.catalog.replicas | default 1 }}
  {{- end }}
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 1
      maxSurge: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: catalog-service
  template:
    metadata:
      labels:
        app.kubernetes.io/name: catalog-service
        {{- include "myreadings.labels" . | nindent 8 }}
      annotations:
        checksum/config: {{ include (print $.Template.BasePath "/configmap-catalog.yaml") . | sha256sum }}
    spec:
      containers:
        - name: catalog-service
          image: {{ .Values.global.imageRegistry }}/{{ .Values.catalog.image }}:{{ .Values.catalog.tag }}
          ports:
            - containerPort: {{ .Values.catalog.port }}
              protocol: TCP
          envFrom:
            - configMapRef:
                name: catalog-service-config
          env:
            {{- include "myreadings.commonEnv" . | nindent 12 }}
          readinessProbe:
            httpGet:
              path: /q/health/ready
              port: {{ .Values.catalog.port }}
            periodSeconds: 10
            timeoutSeconds: 10
          livenessProbe:
            httpGet:
              path: /q/health/live
              port: {{ .Values.catalog.port }}
            periodSeconds: 15
            timeoutSeconds: 10
            failureThreshold: 5
          startupProbe:
            httpGet:
              path: /q/health/started
              port: {{ .Values.catalog.port }}
            failureThreshold: 20
            periodSeconds: 5
          resources:
            {{- toYaml .Values.catalog.resources | nindent 12 }}
