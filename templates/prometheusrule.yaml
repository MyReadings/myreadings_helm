{{- if .Values.alerts.enabled }}
apiVersion: monitoring.coreos.com/v1
kind: PrometheusRule
metadata:
  name: myreadings-alerts
  labels:
    {{- include "myreadings.labels" . | nindent 4 }}
spec:
  groups:
    - name: myreadings.latency
      rules:
        - alert: AppLatencyWarning
          expr: >
            histogram_quantile(0.95,
              sum(rate(http_server_request_duration_seconds_bucket{exported_job=~"myreadings-.*-service"}[2m])) by (le)
            ) > 0.5
          for: 15s
          labels:
            severity: warning
          annotations:
            summary: "P95 latency across all endpoints is above 500ms"
            description: "P95 latency across all MyReadings services has exceeded 500ms."

        - alert: AppLatencyCritical
          expr: >
            histogram_quantile(0.95,
              sum(rate(http_server_request_duration_seconds_bucket{exported_job=~"myreadings-.*-service"}[2m])) by (le)
            ) > 1
          for: 15s
          labels:
            severity: critical
          annotations:
            summary: "P95 latency across all endpoints is above 1s"
            description: "P95 latency across all MyReadings services has exceeded 1 second."

        - alert: SearchLatencyCritical
          expr: >
            histogram_quantile(0.95,
              sum(rate(http_server_request_duration_seconds_bucket{exported_job="myreadings-catalog-service", http_route="/api/v1/books/search"}[2m])) by (le)
            ) > 0.5
          for: 15s
          labels:
            severity: critical
          annotations:
            summary: "Search endpoint P95 latency is above 500ms"
            description: "The /api/v1/books/search endpoint P95 latency on catalog-service has exceeded 500ms."

    - name: myreadings.errors
      rules:
        - alert: AppErrorRateHigh
          expr: >
            sum(rate(http_server_request_duration_seconds_count{exported_job=~"myreadings-.*-service", http_response_status_code=~"5.."}[2m]))
            /
            sum(rate(http_server_request_duration_seconds_count{exported_job=~"myreadings-.*-service"}[2m]))
            > 0.01
          for: 15s
          labels:
            severity: warning
          annotations:
            summary: "HTTP 5xx error rate is above 1%"
            description: "More than 1% of requests across MyReadings services are returning 5xx errors."

    - name: myreadings.saturation
      rules:
        - alert: AppRequestSaturation
          expr: >
            sum(rate(http_server_request_duration_seconds_count{exported_job=~"myreadings-.*-service"}[2m])) > 200
          for: 15s
          labels:
            severity: warning
          annotations:
            summary: "Request rate is above 200 req/s"
            description: "MyReadings is receiving sustained high traffic (>200 req/s)."

        - alert: AppCPUThrottling
          expr: >
            max(rate(container_cpu_usage_seconds_total{namespace="{{ .Release.Namespace }}", container=~".*-service"}[2m]))
            /
            max(kube_pod_container_resource_limits{namespace="{{ .Release.Namespace }}", container=~".*-service", resource="cpu"})
            > 0.8
          for: 15s
          labels:
            severity: warning
          annotations:
            summary: "Service CPU usage is above 80% of its limit"
            description: "A MyReadings service container is consuming more than 80% of its CPU limit."
{{- end }}
