{{- if .Values.alerts.enabled }}
apiVersion: monitoring.coreos.com/v1
kind: PrometheusRule
metadata:
  name: myreadings-alerts
  labels:
    {{- include "myreadings.labels" . | nindent 4 }}
spec:
  groups:
    - name: myreadings.latency
      rules:
        - alert: AppLatencyWarning
          expr: >
            histogram_quantile(0.95,
              sum(rate(http_server_request_duration_seconds_bucket{exported_job=~"myreadings-.*-service"}[30s])) by (le, exported_job)
            ) > 0.5
          for: 0s
          keep_firing_for: 2m
          labels:
            severity: warning
          annotations:
            summary: "P95 latency on {{ "{{" }} $labels.exported_job {{ "}}" }} is above 500ms"
            description: "P95 latency on {{ "{{" }} $labels.exported_job {{ "}}" }} has exceeded 500ms."

        - alert: AppLatencyCritical
          expr: >
            histogram_quantile(0.95,
              sum(rate(http_server_request_duration_seconds_bucket{exported_job=~"myreadings-.*-service"}[30s])) by (le, exported_job)
            ) > 1
          for: 0s
          keep_firing_for: 2m
          labels:
            severity: critical
          annotations:
            summary: "P95 latency on {{ "{{" }} $labels.exported_job {{ "}}" }} is above 1s"
            description: "P95 latency on {{ "{{" }} $labels.exported_job {{ "}}" }} has exceeded 1 second."

    - name: myreadings.errors
      rules:
        - alert: AppErrorRateHigh
          expr: >
            sum(rate(http_server_request_duration_seconds_count{exported_job=~"myreadings-.*-service", http_response_status_code=~"5.."}[30s])) by (exported_job)
            /
            sum(rate(http_server_request_duration_seconds_count{exported_job=~"myreadings-.*-service"}[30s])) by (exported_job)
            > 0.01
          for: 0s
          keep_firing_for: 2m
          labels:
            severity: warning
          annotations:
            summary: "HTTP 5xx error rate on {{ "{{" }} $labels.exported_job {{ "}}" }} is above 1%"
            description: "More than 1% of requests on {{ "{{" }} $labels.exported_job {{ "}}" }} are returning 5xx errors."

    - name: myreadings.saturation
      rules:
        - alert: AppCPUThrottling
          expr: >
            max by (k8s_container_name, k8s_pod_name) (
              container_cpu_usage{k8s_namespace_name="{{ .Release.Namespace }}", k8s_container_name=~".*-service"}
              / on(k8s_container_name, k8s_pod_name, k8s_namespace_name) group_left()
              max by (k8s_container_name, k8s_pod_name, k8s_namespace_name) (
                k8s_container_cpu_limit{k8s_namespace_name="{{ .Release.Namespace }}", k8s_container_name=~".*-service"}
              )
            ) > 0.8
          for: 0s
          keep_firing_for: 2m
          labels:
            severity: warning
          annotations:
            summary: "{{ "{{" }} $labels.k8s_container_name {{ "}}" }} in pod {{ "{{" }} $labels.k8s_pod_name {{ "}}" }} CPU above 80% of limit"
            description: "Container {{ "{{" }} $labels.k8s_container_name {{ "}}" }} in pod {{ "{{" }} $labels.k8s_pod_name {{ "}}" }} is consuming more than 80% of its CPU limit."

    - name: myreadings.availability
      rules:
        - alert: ContainerRestarting
          expr: >
            max by (k8s_container_name, k8s_pod_name, k8s_namespace_name) (
              k8s_container_restarts{k8s_namespace_name="{{ .Release.Namespace }}", k8s_container_name=~".*-service"}
            ) > 3
          for: 0s
          keep_firing_for: 2m
          labels:
            severity: critical
          annotations:
            summary: "Container {{ "{{" }} $labels.k8s_container_name {{ "}}" }} is restarting"
            description: "Container {{ "{{" }} $labels.k8s_container_name {{ "}}" }} in pod {{ "{{" }} $labels.k8s_pod_name {{ "}}" }} has restarted. Count: {{ "{{" }} $value {{ "}}" }}."

        - alert: ContainerMemoryHigh
          expr: >
            max by (k8s_container_name, k8s_pod_name) (
              container_memory_usage_bytes{k8s_namespace_name="{{ .Release.Namespace }}", k8s_container_name=~".*-service"}
              / on(k8s_container_name, k8s_pod_name, k8s_namespace_name) group_left()
              max by (k8s_container_name, k8s_pod_name, k8s_namespace_name) (
                k8s_container_memory_limit_bytes{k8s_namespace_name="{{ .Release.Namespace }}", k8s_container_name=~".*-service"}
              )
            ) > 0.75
          for: 0s
          keep_firing_for: 2m
          labels:
            severity: warning
          annotations:
            summary: "Container {{ "{{" }} $labels.k8s_container_name {{ "}}" }} memory above 85% of limit"
            description: "Container {{ "{{" }} $labels.k8s_container_name {{ "}}" }} in pod {{ "{{" }} $labels.k8s_pod_name {{ "}}" }} is using more than 85% of its memory limit."
{{- end }}