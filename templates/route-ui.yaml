apiVersion: route.openshift.io/v1
kind: Route
metadata:
  name: myreadings-ui
  labels:
    app.kubernetes.io/name: myreadings-ui
    {{- include "myreadings.labels" . | nindent 4 }}
spec:
  to:
    kind: Service
    name: myreadings-ui
  port:
    targetPort: http
  tls:
    termination: edge
    insecureEdgeTerminationPolicy: Redirect
