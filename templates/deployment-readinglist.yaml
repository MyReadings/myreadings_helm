apiVersion: apps/v1
kind: Deployment
metadata:
  name: readinglist-service
  labels:
    app.kubernetes.io/name: readinglist-service
    {{- include "myreadings.labels" . | nindent 4 }}
spec:
  {{- if not (and .Values.readinglist.autoscaling .Values.readinglist.autoscaling.enabled) }}
  replicas: {{ .Values.readinglist.replicas | default 1 }}
  {{- end }}
  selector:
    matchLabels:
      app.kubernetes.io/name: readinglist-service
  template:
    metadata:
      labels:
        app.kubernetes.io/name: readinglist-service
        {{- include "myreadings.labels" . | nindent 8 }}
      annotations:
        checksum/config: {{ include (print $.Template.BasePath "/configmap-readinglist.yaml") . | sha256sum }}
    spec:
      containers:
        - name: readinglist-service
          image: {{ .Values.global.imageRegistry }}/{{ .Values.readinglist.image }}:{{ .Values.readinglist.tag }}
          ports:
            - containerPort: {{ .Values.readinglist.port }}
              protocol: TCP
          envFrom:
            - configMapRef:
                name: readinglist-service-config
          env:
            {{- include "myreadings.commonEnv" . | nindent 12 }}
            {{- include "myreadings.rabbitmqEnv" . | nindent 12 }}
            - name: CATALOG_SERVICE_URL
              value: "http://catalog-service:{{ .Values.catalog.port }}"
            - name: USER_SERVICE_URL
              value: "http://user-service:{{ .Values.user.port }}"
          readinessProbe:
            httpGet:
              path: /q/health/ready
              port: {{ .Values.readinglist.port }}
            periodSeconds: 5
            timeoutSeconds: 3
          livenessProbe:
            httpGet:
              path: /q/health/live
              port: {{ .Values.readinglist.port }}
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 3
          startupProbe:
            httpGet:
              path: /q/health/started
              port: {{ .Values.readinglist.port }}
            failureThreshold: 20
            periodSeconds: 5
          resources:
            {{- toYaml .Values.readinglist.resources | nindent 12 }}
