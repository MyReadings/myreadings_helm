apiVersion: v1
kind: Service
metadata:
  name: myreadings-ui
  labels:
    app.kubernetes.io/name: myreadings-ui
    {{- include "myreadings.labels" . | nindent 4 }}
spec:
  selector:
    app.kubernetes.io/name: myreadings-ui
  ports:
    - name: http
      port: {{ .Values.ui.port }}
      targetPort: {{ .Values.ui.port }}
      protocol: TCP
